<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="40%" stop-color="#fef3e2" />
      <stop offset="100%" stop-color="#fde8cd" />
    </linearGradient>

    <!-- Warm Wall Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff2c2" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ffe299" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fde8cd" stop-opacity="0" />
    </radialGradient>

    <!-- Gold / Brass Gradient for Thali & Diyas -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>

    <!-- Grandfather Kurta Gradient -->
    <linearGradient id="gfKurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="100%" stop-color="#d9e2ec" />
    </linearGradient>

    <!-- Baby Aarav Kurta Gradient -->
    <linearGradient id="babyKurtaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>

    <!-- Cake Frosting Gradient -->
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff0f5" />
      <stop offset="100%" stop-color="#f8bbd0" />
    </linearGradient>

    <!-- Candle Flame Glow -->
    <radialGradient id="flameGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="40%" stop-color="#ffeb3b" />
      <stop offset="80%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12" flood-color="#4a2810" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#lampGlow)" />

  <!-- Soft Ambient Wall Texture & Traditional Arch Pattern in Background -->
  <path d="M 0 160 Q 200 120 400 160 Q 600 200 800 160 L 800 0 L 0 0 Z" fill="#faebd7" opacity="0.4" />
  
  <!-- Festive Bunting / Pennants (Top) -->
  <g opacity="0.9">
    <path d="M 0 40 Q 200 90 400 50 Q 600 90 800 40" fill="none" stroke="#b08968" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Flags -->
    <polygon points="50,48 75,95 100,53" fill="#e57373" />
    <polygon points="120,56 145,103 170,62" fill="#ffd54f" />
    <polygon points="190,65 215,112 240,70" fill="#81c784" />
    <polygon points="260,70 285,115 310,72" fill="#64b5f6" />
    <polygon points="330,71 355,113 380,68" fill="#ba68c8" />
    <polygon points="400,65 425,110 450,60" fill="#ff8a65" />
    <polygon points="470,58 495,102 520,53" fill="#ffd54f" />
    <polygon points="540,51 565,95 590,47" fill="#4db6ac" />
    <polygon points="610,46 635,90 660,42" fill="#f06292" />
    <polygon points="680,41 705,85 730,38" fill="#ffb74d" />
  </g>

  <!-- Marigold Flower Garland (Genda Phool) Across the Top -->
  <g>
    <!-- Garland string 1 -->
    <path d="M 20 80 Q 200 130 380 90 Q 560 130 780 80" fill="none" stroke="#2e7d32" stroke-width="2" />
    <!-- Marigold pom-poms (yellow and saffron) -->
    <circle cx="40" cy="85" r="9" fill="#ff9800" />
    <circle cx="40" cy="85" r="6" fill="#ffc107" />
    <circle cx="65" cy="92" r="9" fill="#f57c00" />
    <circle cx="65" cy="92" r="6" fill="#ffeb3b" />
    <circle cx="90" cy="98" r="9" fill="#ff9800" />
    <circle cx="115" cy="103" r="9" fill="#f57c00" />
    <circle cx="140" cy="108" r="9" fill="#ffc107" />
    <circle cx="165" cy="111" r="9" fill="#ff9800" />
    <circle cx="190" cy="113" r="9" fill="#f57c00" />
    <circle cx="215" cy="113" r="9" fill="#ffc107" />
    <circle cx="240" cy="111" r="9" fill="#ff9800" />
    <circle cx="265" cy="108" r="9" fill="#f57c00" />
    <circle cx="290" cy="104" r="9" fill="#ffc107" />
    <circle cx="315" cy="100" r="9" fill="#ff9800" />
    <circle cx="340" cy="95" r="9" fill="#f57c00" />
    <circle cx="365" cy="91" r="9" fill="#ffc107" />
    <circle cx="390" cy="89" r="9" fill="#ff9800" />
    <circle cx="415" cy="91" r="9" fill="#f57c00" />
    <circle cx="440" cy="95" r="9" fill="#ffc107" />
    <circle cx="465" cy="101" r="9" fill="#ff9800" />
    <circle cx="490" cy="106" r="9" fill="#f57c00" />
    <circle cx="515" cy="110" r="9" fill="#ffc107" />
    <circle cx="540" cy="112" r="9" fill="#ff9800" />
    <circle cx="565" cy="112" r="9" fill="#f57c00" />
    <circle cx="590" cy="110" r="9" fill="#ffc107" />
    <circle cx="615" cy="106" r="9" fill="#ff9800" />
    <circle cx="640" cy="101" r="9" fill="#f57c00" />
    <circle cx="665" cy="95" r="9" fill="#ffc107" />
    <circle cx="690" cy="89" r="9" fill="#ff9800" />
    <circle cx="715" cy="84" r="9" fill="#f57c00" />
    <circle cx="740" cy="79" r="9" fill="#ffc107" />
    <circle cx="765" cy="75" r="9" fill="#ff9800" />
  </g>

  <!-- Festive Balloons (Left & Right background) -->
  <g opacity="0.85">
    <!-- Left balloons -->
    <ellipse cx="90" cy="210" rx="35" ry="45" fill="#42a5f5" />
    <path d="M 90 255 L 85 262 L 95 262 Z" fill="#1e88e5" />
    <path d="M 90 262 Q 95 320 110 380" fill="none" stroke="#90a4ae" stroke-width="1.5" />

    <ellipse cx="140" cy="190" rx="32" ry="42" fill="#ab47bc" />
    <path d="M 140 232 L 135 239 L 145 239 Z" fill="#8e24aa" />
    <path d="M 140 239 Q 135 300 120 380" fill="none" stroke="#90a4ae" stroke-width="1.5" />

    <ellipse cx="70" cy="270" rx="30" ry="38" fill="#ffca28" />
    <path d="M 70 308 L 65 315 L 75 315 Z" fill="#f57f17" />
    <path d="M 70 315 Q 85 350 115 385" fill="none" stroke="#90a4ae" stroke-width="1.5" />

    <!-- Right balloons -->
    <ellipse cx="710" cy="200" rx="35" ry="45" fill="#ef5350" />
    <path d="M 710 245 L 705 252 L 715 252 Z" fill="#d32f2f" />
    <path d="M 710 252 Q 695 320 680 380" fill="none" stroke="#90a4ae" stroke-width="1.5" />

    <ellipse cx="660" cy="240" rx="32" ry="42" fill="#26a69a" />
    <path d="M 660 282 L 655 289 L 665 289 Z" fill="#00897b" />
    <path d="M 660 289 Q 670 340 685 380" fill="none" stroke="#90a4ae" stroke-width="1.5" />
  </g>

  <!-- Fairy Lights Warm Sparkles in Background -->
  <g fill="#ffe082" opacity="0.8">
    <circle cx="210" cy="180" r="3" filter="url(#softGlow)" />
    <circle cx="260" cy="220" r="2.5" filter="url(#softGlow)" />
    <circle cx="180" cy="270" r="3.5" filter="url(#softGlow)" />
    <circle cx="580" cy="190" r="3" filter="url(#softGlow)" />
    <circle cx="620" cy="160" r="3.5" filter="url(#softGlow)" />
    <circle cx="560" cy="250" r="2.5" filter="url(#softGlow)" />
  </g>

  <!-- TABLE SURFACE (Foreground bottom) -->
  <path d="M 0 460 Q 400 445 800 460 L 800 600 L 0 600 Z" fill="#5d4037" />
  <!-- Table cloth runner -->
  <path d="M 120 455 Q 400 442 680 455 L 670 600 L 130 600 Z" fill="#fff9c4" opacity="0.9" />
  <!-- Table cloth border pattern -->
  <path d="M 125 460 Q 400 447 675 460" stroke="#f57f17" stroke-width="3" fill="none" />
  <path d="M 130 466 Q 400 453 670 466" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,4" fill="none" />

  <!-- ================= GRANDFATHER (Anand Sharma) ================= -->
  <!-- Sitting warmly on left side leaning towards Aarav -->
  <g id="grandfather">
    <!-- Grandfather Body / Shoulders -->
    <path d="M 170 330 Q 280 300 370 350 L 390 480 Q 260 500 150 480 Z" fill="url(#gfKurtaGrad)" />
    <!-- Kurta Collar & Placket -->
    <path d="M 270 315 L 290 315 L 285 390 L 275 390 Z" fill="#cfd8dc" />
    <circle cx="280" cy="335" r="2" fill="#90a4ae" />
    <circle cx="280" cy="355" r="2" fill="#90a4ae" />
    <circle cx="280" cy="375" r="2" fill="#90a4ae" />

    <!-- Supporting Arm holding Aarav tenderly -->
    <path d="M 340 370 Q 400 380 440 400 Q 430 430 380 420 Z" fill="url(#gfKurtaGrad)" />
    <ellipse cx="445" cy="405" rx="14" ry="10" fill="#d7a177" /> <!-- Hand supporting baby -->

    <!-- Grandfather Neck -->
    <path d="M 260 290 L 300 290 L 295 320 L 265 320 Z" fill="#d7a177" />

    <!-- Grandfather Head -->
    <ellipse cx="280" cy="245" rx="42" ry="50" fill="#e0ab85" />
    <!-- White Hair / Temples -->
    <path d="M 238 240 Q 235 200 280 195 Q 325 200 322 240 Q 320 205 280 202 Q 240 205 238 240 Z" fill="#eceff1" />
    <path d="M 238 235 Q 234 260 240 270 Q 243 255 242 238 Z" fill="#e0e0e0" />
    <path d="M 322 235 Q 326 260 320 270 Q 317 255 318 238 Z" fill="#e0e0e0" />

    <!-- Ears -->
    <ellipse cx="238" cy="248" rx="6" ry="12" fill="#d7a177" />
    <ellipse cx="322" cy="248" rx="6" ry="12" fill="#d7a177" />

    <!-- Spectacles / Glasses (Classic round frames) -->
    <circle cx="266" cy="242" r="13" fill="none" stroke="#5d4037" stroke-width="2.5" />
    <circle cx="294" cy="242" r="13" fill="none" stroke="#5d4037" stroke-width="2.5" />
    <line x1="279" y1="242" x2="281" y2="242" stroke="#5d4037" stroke-width="2.5" />
    <line x1="253" y1="240" x2="238" y2="244" stroke="#5d4037" stroke-width="2" />
    <line x1="307" y1="240" x2="322" y2="244" stroke="#5d4037" stroke-width="2" />

    <!-- Eyes (Warm, smiling crescent curves behind lenses) -->
    <path d="M 259 243 Q 266 238 273 243" fill="none" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 287 243 Q 294 238 301 243" fill="none" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round" />

    <!-- Gentle Laugh Lines & Eyebrows -->
    <path d="M 256 232 Q 266 228 274 232" fill="none" stroke="#b0bec5" stroke-width="2" stroke-linecap="round" />
    <path d="M 286 232 Q 294 228 304 232" fill="none" stroke="#b0bec5" stroke-width="2" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 280 240 Q 284 254 280 258 Q 275 258 273 255" fill="none" stroke="#c58e65" stroke-width="2" />

    <!-- Moustache (Neat grey-white moustache) -->
    <path d="M 264 268 Q 280 264 296 268 Q 280 273 264 268 Z" fill="#cfd8dc" />

    <!-- Warm Smiling Mouth -->
    <path d="M 268 274 Q 280 284 292 274" fill="none" stroke="#8d4024" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ================= GRANDSON AARAV (1 Year Old) ================= -->
  <!-- Sitting proudly in front / center in bright festive yellow kurta -->
  <g id="baby-aarav">
    <!-- Cute Festive Kurta Body -->
    <path d="M 430 350 Q 480 320 530 350 L 545 470 Q 480 480 415 470 Z" fill="url(#babyKurtaGrad)" filter="url(#cardShadow)" />
    <!-- Traditional red embroidery on kurta neckline -->
    <path d="M 470 335 L 490 335 L 485 410 L 475 410 Z" fill="#c62828" />
    <circle cx="480" cy="355" r="2.5" fill="#ffd54f" />
    <circle cx="480" cy="375" r="2.5" fill="#ffd54f" />
    <circle cx="480" cy="395" r="2.5" fill="#ffd54f" />

    <!-- Little Arms / Hands clapping with joy -->
    <path d="M 435 370 Q 410 395 435 415" fill="none" stroke="#fbc02d" stroke-width="22" stroke-linecap="round" />
    <ellipse cx="438" cy="415" rx="10" ry="9" fill="#f0bc94" /> <!-- Left little hand -->
    
    <path d="M 525 370 Q 550 395 525 415" fill="none" stroke="#fbc02d" stroke-width="22" stroke-linecap="round" />
    <ellipse cx="522" cy="415" rx="10" ry="9" fill="#f0bc94" /> <!-- Right little hand -->

    <!-- Baby Neck -->
    <path d="M 465 315 L 495 315 L 492 338 L 468 338 Z" fill="#f0bc94" />

    <!-- Chubby Baby Head -->
    <ellipse cx="480" cy="275" rx="38" ry="42" fill="#f7caa7" />

    <!-- Rosy Chubby Cheeks -->
    <ellipse cx="454" cy="285" rx="11" ry="8" fill="#ff8a80" opacity="0.45" />
    <ellipse cx="506" cy="285" rx="11" ry="8" fill="#ff8a80" opacity="0.45" />

    <!-- Baby Hair (Cute tuft of silky black baby hair) -->
    <path d="M 446 250 Q 450 230 480 232 Q 512 230 514 252 Q 505 240 480 240 Q 455 240 446 250 Z" fill="#212121" />
    <path d="M 478 232 Q 482 220 488 226 Q 484 231 478 232 Z" fill="#212121" /> <!-- Cute top curl -->

    <!-- Small Ears -->
    <ellipse cx="442" cy="278" rx="5" ry="9" fill="#f0bc94" />
    <ellipse cx="518" cy="278" rx="5" ry="9" fill="#f0bc94" />

    <!-- Big Innocent Sparkly Baby Eyes -->
    <ellipse cx="463" cy="272" rx="7" ry="8" fill="#212121" />
    <circle cx="461" cy="269" r="2.5" fill="#ffffff" />
    <circle cx="465" cy="274" r="1.2" fill="#ffffff" />

    <ellipse cx="497" cy="272" rx="7" ry="8" fill="#212121" />
    <circle cx="495" cy="269" r="2.5" fill="#ffffff" />
    <circle cx="499" cy="274" r="1.2" fill="#ffffff" />

    <!-- Cute Small Eyebrows -->
    <path d="M 456 261 Q 464 257 470 262" fill="none" stroke="#424242" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 490 262 Q 496 257 504 261" fill="none" stroke="#424242" stroke-width="1.8" stroke-linecap="round" />

    <!-- Tiny Button Nose -->
    <ellipse cx="480" cy="281" rx="3.5" ry="2.5" fill="#e59870" />

    <!-- Big Happy Open-Mouth Smile -->
    <path d="M 468 292 Q 480 308 492 292 Z" fill="#d32f2f" />
    <path d="M 473 293 Q 480 297 487 293" fill="#ffffff" /> <!-- Two tiny baby milk teeth -->

    <!-- Traditional Red Tikka / Bindi on forehead for blessings -->
    <circle cx="480" cy="254" r="3" fill="#c62828" />

    <!-- Little Birthday Party Crown / Hat (Optional fun festive touch) -->
    <polygon points="462,234 472,212 480,224 488,212 498,234" fill="#ffd54f" stroke="#f57f17" stroke-width="1.5" />
    <circle cx="472" cy="212" r="2.5" fill="#e91e63" />
    <circle cx="480" cy="224" r="2" fill="#00bcd4" />
    <circle cx="488" cy="212" r="2.5" fill="#e91e63" />
  </g>

  <!-- ================= BIRTHDAY CAKE & SWEETS ON TABLE ================= -->
  <!-- Center: 1st Birthday Cake -->
  <g id="birthday-cake" transform="translate(320, 420)" filter="url(#cardShadow)">
    <!-- Cake Stand Base -->
    <ellipse cx="80" cy="95" rx="70" ry="12" fill="#e0e0e0" />
    <ellipse cx="80" cy="92" rx="65" ry="10" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5" />

    <!-- Bottom Cake Layer -->
    <path d="M 30 50 L 30 75 Q 80 92 130 75 L 130 50 Z" fill="url(#cakeGrad)" />
    <ellipse cx="80" cy="50" rx="50" ry="14" fill="#ffffff" stroke="#f8bbd0" stroke-width="1.5" />

    <!-- Cake Decorative Pipings / Berries -->
    <circle cx="40" cy="50" r="4" fill="#e91e63" />
    <circle cx="55" cy="56" r="4" fill="#ff4081" />
    <circle cx="72" cy="59" r="4" fill="#e91e63" />
    <circle cx="88" cy="59" r="4" fill="#ff4081" />
    <circle cx="105" cy="56" r="4" fill="#e91e63" />
    <circle cx="120" cy="50" r="4" fill="#ff4081" />

    <!-- Number "1" Candle -->
    <g transform="translate(73, 10)">
      <!-- Candle body "1" shape -->
      <path d="M 4 14 L 7 10 L 10 10 L 10 32 L 6 32 L 6 32 L 14 32" fill="#3949ab" stroke="#1a237e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="7" y="10" width="3" height="22" fill="#5c6bc0" />
      <!-- Wick -->
      <line x1="8.5" y1="10" x2="8.5" y2="4" stroke="#212121" stroke-width="1.5" />
      <!-- Flame with Glow -->
      <ellipse cx="8.5" cy="-2" rx="6" ry="10" fill="url(#flameGlow)" />
      <ellipse cx="8.5" cy="-1" rx="3.5" ry="6" fill="#fffde7" />
    </g>
  </g>

  <!-- Traditional Brass Thali with Indian Sweets (Ladoos & Pedas) on Right Table -->
  <g id="sweets-thali" transform="translate(560, 450)" filter="url(#cardShadow)">
    <!-- Brass Thali Platter -->
    <ellipse cx="80" cy="45" rx="65" ry="24" fill="url(#brassGrad)" stroke="#ff8f00" stroke-width="2" />
    <ellipse cx="80" cy="43" rx="56" ry="18" fill="#fff8e1" opacity="0.6" />

    <!-- Motichoor & Besan Ladoos (Golden Yellow Spheres with Pistachio bits) -->
    <g transform="translate(50, 20)">
      <!-- Ladoo 1 -->
      <circle cx="15" cy="18" r="10" fill="#ffb300" stroke="#f57f17" stroke-width="0.8" />
      <circle cx="14" cy="16" r="1.5" fill="#4caf50" />
      <circle cx="17" cy="19" r="1" fill="#d32f2f" />

      <!-- Ladoo 2 -->
      <circle cx="32" cy="17" r="10" fill="#ffa000" stroke="#f57f17" stroke-width="0.8" />
      <circle cx="30" cy="15" r="1.5" fill="#4caf50" />

      <!-- Ladoo 3 -->
      <circle cx="48" cy="19" r="10" fill="#ffb300" stroke="#f57f17" stroke-width="0.8" />
      <circle cx="47" cy="17" r="1.5" fill="#4caf50" />

      <!-- Ladoo 4 (Front) -->
      <circle cx="23" cy="28" r="10" fill="#ffb300" stroke="#f57f17" stroke-width="0.8" />
      <circle cx="21" cy="26" r="1.5" fill="#4caf50" />

      <!-- Ladoo 5 (Front right) -->
      <circle cx="40" cy="28" r="10" fill="#ffa000" stroke="#f57f17" stroke-width="0.8" />
      <circle cx="39" cy="27" r="1.5" fill="#4caf50" />

      <!-- Top Pyramidal Ladoo -->
      <circle cx="32" cy="8" r="10" fill="#ffb300" stroke="#f57f17" stroke-width="0.8" />
      <circle cx="31" cy="6" r="1.5" fill="#4caf50" />
    </g>

    <!-- Traditional Brass Diya on Thali corner -->
    <path d="M 130 38 Q 140 45 150 38 Q 142 50 130 38 Z" fill="url(#brassGrad)" />
    <ellipse cx="148" cy="33" rx="4" ry="6" fill="url(#flameGlow)" />
  </g>

  <!-- Brass Diya on Left Table -->
  <g transform="translate(160, 480)" filter="url(#cardShadow)">
    <path d="M 10 20 Q 25 32 40 20 Q 28 38 10 20 Z" fill="url(#brassGrad)" />
    <ellipse cx="38" cy="13" rx="5" ry="8" fill="url(#flameGlow)" />
    <ellipse cx="38" cy="14" rx="2.5" ry="4" fill="#fffde7" />
  </g>

  <!-- Festive Text Ribbon Overlay (Subtle, elegant photo keepsake badge) -->
  <g transform="translate(20, 530)" opacity="0.95">
    <rect x="0" y="0" width="310" height="52" rx="14" fill="#ffffff" fill-opacity="0.94" filter="url(#cardShadow)" />
    <text x="18" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b">
      Aarav's 1st Birthday • 2021
    </text>
    <text x="18" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b45309">
      Family blessings, sweets & joyful moments
    </text>
  </g>
</svg>
